name: QuickPOS CI/CD Pipeline

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main

jobs:

  # JOB 1: Validate Jira commit message
  validate-commit:
    name: "Stage 10 - Jira Commit Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Check Jira ID in commit
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if [[ -z "$MSG" ]]; then
            MSG="Merge PR"
          fi
          echo "Commit: $MSG"
          if [[ "$MSG" =~ \[POS-[0-9]+\] ]] || [[ "$MSG" =~ ^Merge ]]; then
            echo "✅ Valid Jira commit message"
          else
            echo "❌ Missing Jira ID like [POS-101]"
            exit 1
          fi

  # JOB 2: Code Quality (runs PARALLEL with Job 3)
  code-quality:
    name: "Stage 3 - Code Quality Check"
    runs-on: ubuntu-latest
    needs: validate-commit
    steps:
      - name: "Stage 1 - Checkout Code"
        uses: actions/checkout@v4

      - name: "Stage 2 - Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: phpcs

      - name: Run PHP CodeSniffer
        run: |
          phpcs --standard=PSR12 --extensions=php \
                --ignore=vendor/ \
                index.php contact.php || true
          echo "✅ Code quality done"

  # JOB 3: Tests + Syntax (runs PARALLEL with Job 2)
  automated-tests:
    name: "Stage 4 - Automated Tests"
    runs-on: ubuntu-latest
    needs: validate-commit
    steps:
      - name: "Stage 1 - Checkout Code"
        uses: actions/checkout@v4

      - name: "Stage 2 - Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: "Stage 5 - Syntax Check index.php"
        run: php -l index.php

      - name: "Stage 5 - Syntax Check contact.php"
        run: php -l contact.php

      - name: "Stage 4 - Run PHPUnit Tests"
        run: ./vendor/bin/phpunit --configuration phpunit.xml --testdox

      - name: "Stage 6 - Upload Test Report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: test-report.xml

  # JOB 4: Final gate - both jobs must pass
  pipeline-success:
    name: "All Checks Passed"
    runs-on: ubuntu-latest
    needs: [code-quality, automated-tests]
    steps:
      - name: Done
        run: echo "✅ Pipeline complete. Safe to merge."